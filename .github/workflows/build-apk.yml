name: Build APK

on:
  workflow_dispatch:
    inputs:
      scummvm_ref:
        description: ScummVM tag or branch to build
        default: v2026.2.0
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-apk.yml"
      - "build/**"
      - "patches/**"
      - "signing/**"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SCUMMVM_REF: ${{ inputs.scummvm_ref || 'v2026.2.0' }}
      NDK_VERSION: 23.2.8568313
      OBOE_REF: 1.9.3
      OGG_REF: v1.3.5
      VORBIS_REF: v1.3.7
    defaults:
      run:
        shell: bash

    steps:
      - name: Check out this repo
        uses: actions/checkout@v4

      - name: Check out ScummVM
        uses: actions/checkout@v4
        with:
          repository: scummvm/scummvm
          ref: ${{ env.SCUMMVM_REF }}
          path: scummvm
          fetch-depth: 1

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Android SDK pieces
        run: |
          SDK="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$SDK/ndk/${NDK_VERSION}" >> "$GITHUB_ENV"
          SDKM="$SDK/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKM" --licenses > /dev/null || true
          # ScummVM's configure insists on exactly this NDK version.
          "$SDKM" "ndk;${NDK_VERSION}"
          # Gradle can fetch the platform and build tools itself if this one is missing.
          "$SDKM" "platforms;android-37" || true

      - name: Apply patches
        run: |
          shopt -s nullglob
          # Use patches/<ref>/ when it exists (the patches differ per ScummVM version), else patches/
          DIR=patches
          if [ -d "patches/$SCUMMVM_REF" ]; then DIR="patches/$SCUMMVM_REF"; fi
          echo "Patch directory: $DIR"
          for p in "$DIR"/*.patch; do
            echo "Applying $p"
            git -C scummvm apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
          done

      # ScummVM's Android audio code needs Google's Oboe library, which is not in the NDK.
      # Build it from source as a static library for 32-bit ARM.
      - name: Build Oboe audio library (armeabi-v7a)
        run: |
          set -o pipefail
          git clone --depth 1 --branch "$OBOE_REF" https://github.com/google/oboe oboe-src
          cmake -S oboe-src -B oboe-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a \
            -DANDROID_PLATFORM=android-16 \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 2>&1 | tee oboe.log
          cmake --build oboe-build -j"$(nproc)" 2>&1 | tee -a oboe.log
          mkdir -p deps-prefix/include deps-prefix/lib
          cp -r oboe-src/include/oboe deps-prefix/include/
          cp "$(find oboe-build -name 'liboboe.a' | head -n 1)" deps-prefix/lib/
          ls -l deps-prefix/lib

      # Ogg Vorbis support (needed for ripped CD-audio music and compressed game audio).
      - name: Build Ogg and Vorbis libraries (armeabi-v7a)
        run: |
          set -o pipefail
          P="$GITHUB_WORKSPACE/deps-prefix"
          COMMON=(
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake"
            -DANDROID_ABI=armeabi-v7a
            -DANDROID_PLATFORM=android-16
            -DBUILD_SHARED_LIBS=OFF
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5
            -DCMAKE_INSTALL_PREFIX="$P"
          )
          git clone --depth 1 --branch "$OGG_REF" https://github.com/xiph/ogg ogg-src
          cmake -S ogg-src -B ogg-build "${COMMON[@]}" -DINSTALL_DOCS=OFF 2>&1 | tee ogg.log
          cmake --build ogg-build -j"$(nproc)" 2>&1 | tee -a ogg.log
          cmake --install ogg-build 2>&1 | tee -a ogg.log
          git clone --depth 1 --branch "$VORBIS_REF" https://github.com/xiph/vorbis vorbis-src
          cmake -S vorbis-src -B vorbis-build "${COMMON[@]}" \
            -DCMAKE_FIND_ROOT_PATH="$P" \
            -DOGG_INCLUDE_DIR="$P/include" \
            -DOGG_LIBRARY="$P/lib/libogg.a" \
            -DINSTALL_DOCS=OFF 2>&1 | tee vorbis.log
          cmake --build vorbis-build -j"$(nproc)" 2>&1 | tee -a vorbis.log
          cmake --install vorbis-build 2>&1 | tee -a vorbis.log
          ls -l "$P/lib" "$P/include"

      # MP3 (libmad) and FLAC support: compressed speech/music files made with ScummVM's
      # compression tools, and ripped CD audio tracks. Optional: a failure here must not
      # block the build, ScummVM's configure just leaves the format out.
      - name: Build MP3 and FLAC libraries (armeabi-v7a)
        continue-on-error: true
        run: |
          set -o pipefail
          P="$GITHUB_WORKSPACE/deps-prefix"
          git clone --depth 1 --branch 1.5.0 https://github.com/xiph/flac flac-src
          cmake -S flac-src -B flac-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-16 \
            -DBUILD_SHARED_LIBS=OFF -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_POSITION_INDEPENDENT_CODE=ON -DCMAKE_POLICY_VERSION_MINIMUM=3.5 \
            -DCMAKE_INSTALL_PREFIX="$P" \
            -DWITH_OGG=OFF -DBUILD_CXXLIBS=OFF -DBUILD_PROGRAMS=OFF -DBUILD_EXAMPLES=OFF \
            -DBUILD_TESTING=OFF -DBUILD_DOCS=OFF -DINSTALL_MANPAGES=OFF 2>&1 | tee flac.log
          cmake --build flac-build -j"$(nproc)" 2>&1 | tee -a flac.log
          cmake --install flac-build 2>&1 | tee -a flac.log
          ls -l "$P/lib"
          git clone --depth 1 https://github.com/markjeee/libmad mad-src
          cd mad-src
          # gcc-only optimisation flags that clang rejects
          sed -i 's/-fforce-mem//; s/-fthread-jumps//; s/-fcse-follow-jumps//; s/-fstrength-reduce//; s/-frerun-cse-after-loop//; s/-fschedule-insns2//' configure
          TC="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
          ./configure --build=x86_64-linux-gnu --host=arm-linux-gnueabi --prefix="$P" \
            --enable-static --disable-shared --disable-debugging --enable-fpm=64bit \
            CC="$TC/armv7a-linux-androideabi16-clang" AR="$TC/llvm-ar" RANLIB="$TC/llvm-ranlib" \
            CFLAGS="-O3 -fPIC" 2>&1 | tee ../mad.log
          make -j"$(nproc)" 2>&1 | tee -a ../mad.log
          make install 2>&1 | tee -a ../mad.log
          ls -l "$P/lib" "$P/include"

      # PNG support: the launcher's grid view draws its game tiles from PNG images. Without it
      # ScummVM aborts with "No PNG support compiled!" when grid view is selected.
      - name: Build libpng (armeabi-v7a)
        run: |
          set -o pipefail
          P="$GITHUB_WORKSPACE/deps-prefix"
          git clone --depth 1 --branch v1.6.47 https://github.com/pnggroup/libpng png-src
          cmake -S png-src -B png-build \
            -DCMAKE_TOOLCHAIN_FILE="$ANDROID_NDK_ROOT/build/cmake/android.toolchain.cmake" \
            -DANDROID_ABI=armeabi-v7a -DANDROID_PLATFORM=android-16 \
            -DCMAKE_BUILD_TYPE=Release -DCMAKE_POSITION_INDEPENDENT_CODE=ON \
            -DCMAKE_POLICY_VERSION_MINIMUM=3.5 -DCMAKE_INSTALL_PREFIX="$P" \
            -DPNG_SHARED=OFF -DPNG_STATIC=ON -DPNG_TESTS=OFF -DPNG_TOOLS=OFF \
            -DPNG_FRAMEWORK=OFF -DPNG_ARM_NEON=off 2>&1 | tee png.log
          cmake --build png-build -j"$(nproc)" 2>&1 | tee -a png.log
          cmake --install png-build 2>&1 | tee -a png.log
          # ScummVM's configure links with -lpng
          if [ ! -f "$P/lib/libpng.a" ]; then cp "$P/lib/libpng16.a" "$P/lib/libpng.a"; fi
          ls -l "$P/lib" "$P/include"

      - name: Configure and build (armeabi-v7a)
        run: |
          set -o pipefail
          export CXXFLAGS="-I$GITHUB_WORKSPACE/deps-prefix/include"
          export LDFLAGS="-L$GITHUB_WORKSPACE/deps-prefix/lib"
          mkdir build-android
          cd build-android
          FLAGS=$(grep -v '^#' ../build/configure-flags.txt | tr '\n' ' ')
          # Drop --disable-engine=X / --enable-engine=X for engines this ScummVM version does not have
          HELP=$(../scummvm/configure --help)
          KEEP=""
          for f in $FLAGS; do
            case "$f" in
              --disable-engine=*|--enable-engine=*)
                e="${f#*=}"
                if echo "$HELP" | grep -qw -- "$e"; then KEEP="$KEEP $f"; else echo "Skipping unknown engine flag $f"; fi ;;
              *) KEEP="$KEEP $f" ;;
            esac
          done
          FLAGS="$KEEP"
          echo "configure flags: $FLAGS" | tee ../build.log
          ../scummvm/configure --host=android-arm-v7a --disable-debug --enable-release $FLAGS 2>&1 | tee -a ../build.log
          # Gradle downloads its tools from Maven Central, which sometimes answers 429 (too many requests).
          # The compiled native code is kept between attempts, so a retry is quick.
          ok=0
          for attempt in 1 2 3 4; do
            if make -j"$(nproc)" androidrelease 2>&1 | tee -a ../build.log; then ok=1; break; fi
            # Only retry download problems. A compile error will fail the same way again.
            if ! tail -n 300 ../build.log | grep -q -E "Could not (resolve|GET)|status code 429|Read timed out|Connection reset"; then
              echo "make failed with a non-download error, not retrying" | tee -a ../build.log
              break
            fi
            echo "make failed (attempt $attempt), retrying in 90 seconds" | tee -a ../build.log
            sleep 90
          done
          [ "$ok" = 1 ]

      - name: Sign APK
        run: |
          STAMP=$(TZ=America/Los_Angeles date +%y%m%d%H%M)
          BT=$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)
          OUT="gtvscumm-${STAMP}.apk"
          "$BT/apksigner" sign \
            --ks signing/sideload.keystore \
            --ks-pass pass:gtvscumm-sideload \
            --key-pass pass:gtvscumm-sideload \
            --out "$OUT" \
            build-android/ScummVM-release-unsigned.apk
          "$BT/apksigner" verify --print-certs "$OUT"
          ls -l "$OUT"
          echo "STAMP=$STAMP" >> "$GITHUB_ENV"
          echo "APK_NAME=$OUT" >> "$GITHUB_ENV"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: gtvscumm-${{ env.STAMP }}
          path: ${{ env.APK_NAME }}
          retention-days: 30

      - name: Publish APK as a release (easy to download on the TV)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${STAMP}" "$APK_NAME" \
            --prerelease \
            --title "Build ${STAMP}" \
            --notes "ScummVM ${SCUMMVM_REF}, armeabi-v7a, SCUMM engine only. Sideload this APK."

      - name: Publish log summary to the build-logs branch
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set +e
          rm -rf /tmp/logrepo
          mkdir -p /tmp/logrepo
          {
            echo "status: $JOB_STATUS"
            echo "scummvm_ref: $SCUMMVM_REF"
            echo "run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "commit: $GITHUB_SHA"
          } > /tmp/logrepo/status.txt
          if [ -f build.log ]; then
            grep -i -E "checking for (ogg|vorbis|tremor|mad|flac)|Checking for PNG|PNG >= |Vorbis file support|MP3|FLAC|oboe" build.log | head -n 16 >> /tmp/logrepo/status.txt
          fi
          for f in oboe ogg vorbis flac mad png; do
            if [ -f "$f.log" ]; then tail -n 80 "$f.log" > "/tmp/logrepo/$f-tail.txt"; fi
          done
          if [ -f build.log ]; then
            head -n 150 build.log > /tmp/logrepo/head.txt
            tail -n 400 build.log > /tmp/logrepo/tail.txt
            grep -n -i -E "error|fatal|FAILED|what went wrong|exit code" build.log | head -n 150 > /tmp/logrepo/errors.txt
          fi
          cd /tmp/logrepo
          git init -q -b build-logs
          git add -A
          git -c user.name="github-actions" -c user.email="actions@users.noreply.github.com" commit -q -m "Build log for run ${GITHUB_RUN_ID}"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" build-logs
